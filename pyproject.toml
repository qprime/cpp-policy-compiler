[project]
name = "polc"
version = "0.1.0"
description = "Projects the policy corpus through a configuration into tiered guidance documents"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
polc = "polc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polc"]

[tool.hatch.build.targets.wheel.force-include]
"docs/policies" = "polc/data/policies"
"docs/standard" = "polc/data/standard"
"docs/exemplars" = "polc/data/exemplars"
"docs/configurations" = "polc/data/configurations"

[dependency-groups]
dev = [
    "build>=1.2",
    "hatchling>=1.27",
    "pytest>=9.1.1",
]
